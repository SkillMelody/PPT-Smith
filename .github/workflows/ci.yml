name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: runtime/pptxgenjs/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install rendering dependencies
        run: |
          brew install --cask libreoffice
          brew install poppler
      - name: Bootstrap pinned PptxGenJS runtime
        run: python scripts/bootstrap_pptxgenjs_runtime.py
      - name: Verify release identity
        run: python scripts/check_identity.py
      - name: Validate skill metadata
        run: python scripts/quick_validate_skill.py
      - name: Run full test suite
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Audit public worktree
        run: python scripts/audit_bundle.py --mode worktree --check --fail-on-finding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
